<style>
/* ===== Modern Mobile App UI (PWA) ===== */
#pwaHeader, #pwaNav { display: none; }

@media (max-width: 900px) {
/* 1. Glassmorphic Top Header */
#pwaHeader {
display: flex !important;
position: fixed !important;
top: 0; left: 0; right: 0;
height: 62px;
background: rgba(13, 11, 34, 0.82) !important;
backdrop-filter: blur(18px) !important;
-webkit-backdrop-filter: blur(18px) !important;
border-bottom: 1px solid rgba(168, 85, 247, 0.22) !important;
z-index: 9000;
align-items: center;
justify-content: space-between;
padding: 0 16px;
box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
}

/* 2. Floating Glass Bottom Navigation */
#pwaNav {
display: flex !important;
position: fixed !important;
bottom: 10px; left: 12px; right: 12px;
height: 66px;
background: rgba(17, 14, 44, 0.9) !important;
backdrop-filter: blur(20px) !important;
-webkit-backdrop-filter: blur(20px) !important;
border: 1px solid rgba(168, 85, 247, 0.3) !important;
border-radius: 22px !important;
z-index: 9000;
justify-content: space-around;
align-items: center;
padding: 0 6px;
box-shadow: 0 14px 40px rgba(0, 0, 0, 0.75), 0 0 20px rgba(168, 85, 247, 0.12);
}

body.pwa-mobile {
overflow-x: hidden;
-webkit-tap-highlight-color: transparent;
}

/* 3. Main Content Container */
body.pwa-mobile .main {
margin: 0 !important;
padding: 78px 14px 96px 14px !important;
width: 100% !important;
max-width: 100% !important;
box-sizing: border-box;
}

/* 4. Modern Slide-Out Side Drawer */
body.pwa-mobile .sidebar {
position: fixed !important;
top: 0 !important;
bottom: 0 !important;
right: -310px !important;
left: auto !important;
width: 285px !important;
height: 100vh !important;
z-index: 9999 !important;
flex-direction: column !important;
justify-content: flex-start !important;
gap: 6px !important;
transition: right 0.32s cubic-bezier(0.22, 1, 0.36, 1) !important;
background: linear-gradient(165deg, #13112c 0%, #0a0919 100%) !important;
border-left: 1px solid rgba(168, 85, 247, 0.28) !important;
border-top: none !important;
overflow-y: auto !important;
overflow-x: hidden !important;
padding: 22px 14px 30px !important;
box-shadow: -15px 0 45px rgba(0, 0, 0, 0.85) !important;
}
body.pwa-mobile .sidebar.open {
right: 0 !important;
}
body.pwa-mobile .sidebar .brand-modern {
display: flex !important;
padding-bottom: 16px !important;
margin-bottom: 10px !important;
border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
}
body.pwa-mobile .sidebar .nav-item {
flex-direction: row !important;
justify-content: flex-start !important;
width: 100% !important;
min-width: unset !important;
padding: 13px 16px !important;
font-size: 14px !important;
font-weight: 700 !important;
border-radius: 14px !important;
color: #cbd5e1 !important;
transition: all 0.2s ease !important;
}
body.pwa-mobile .sidebar .nav-item:active {
transform: scale(0.97);
}
body.pwa-mobile .sidebar .nav-item.active {
background: linear-gradient(90deg, rgba(99, 102, 241, 0.3), rgba(236, 72, 153, 0.15)) !important;
color: #ffffff !important;
border: 1px solid rgba(168, 85, 247, 0.45) !important;
box-shadow: 0 6px 20px rgba(168, 85, 247, 0.2) !important;
}

/* 5. Page Headings */
body.pwa-mobile .page-head {
margin-bottom: 18px !important;
gap: 10px !important;
}
body.pwa-mobile .page-title {
font-size: 21px !important;
font-weight: 900 !important;
background: linear-gradient(135deg, #ffffff 20%, #d8b4fe 100%) !important;
-webkit-background-clip: text !important;
background-clip: text !important;
color: transparent !important;
}

/* 6. Smart Grids: 2-Cols for Stats (.grid-4), 1-Col Full Width for Content */
body.pwa-mobile .grid-4 {
display: grid !important;
grid-template-columns: 1fr 1fr !important;
gap: 12px !important;
}
body.pwa-mobile .grid-3,
body.pwa-mobile .grid-2,
body.pwa-mobile .grid:not(.grid-4) {
display: grid !important;
grid-template-columns: 1fr !important;
gap: 14px !important;
}

/* 7. Sleek Cards */
body.pwa-mobile .card {
padding: 18px 16px !important;
border-radius: 20px !important;
background: linear-gradient(145deg, rgba(30, 27, 75, 0.78), rgba(20, 20, 42, 0.9)) !important;
border: 1px solid rgba(168, 85, 247, 0.22) !important;
box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38) !important;
text-align: right !important;
margin: 0 !important;
color: #fff !important;
backdrop-filter: blur(10px);
}

/* Stat Cards specifically centered & compact */
body.pwa-mobile .grid-4 > .card {
text-align: center !important;
padding: 18px 12px !important;
position: relative;
overflow: hidden;
}
body.pwa-mobile .grid-4 > .card::after {
content: '';
position: standalone;
position: absolute;
top: -30px; left: -30px;
width: 70px; height: 70px;
background: radial-gradient(circle, rgba(168, 85, 247, 0.25), transparent 70%);
pointer-events: none;
}
body.pwa-mobile .stat-value {
font-size: 32px !important;
font-weight: 900 !important;
background: linear-gradient(135deg, #a855f7, #ec4899) !important;
-webkit-background-clip: text !important;
background-clip: text !important;
color: transparent !important;
line-height: 1.1 !important;
margin-bottom: 6px !important;
}
body.pwa-mobile .stat-label {
font-size: 12px !important;
color: #cbd5e1 !important;
font-weight: 700 !important;
}

/* 8. Lesson Cards & Interactive Touch */
body.pwa-mobile .lesson-card {
border-right: 4px solid #a855f7 !important;
transition: transform 0.18s ease, box-shadow 0.18s ease !important;
}
body.pwa-mobile .lesson-card:active {
transform: scale(0.98) !important;
}
body.pwa-mobile .lesson-card h3 {
font-size: 17px !important;
color: #fff !important;
}

/* 9. Progress Bar */
body.pwa-mobile .bar {
height: 9px !important;
background: rgba(0, 0, 0, 0.45) !important;
border-radius: 100px !important;
overflow: hidden !important;
}
body.pwa-mobile .bar > div {
height: 100% !important;
background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899) !important;
box-shadow: 0 0 12px rgba(236, 72, 153, 0.6) !important;
}

/* 10. Buttons & Inputs Touch Optimization */
body.pwa-mobile .btn {
border-radius: 14px !important;
font-weight: 800 !important;
transition: transform 0.15s ease !important;
}
body.pwa-mobile .btn:active {
transform: scale(0.96) !important;
}
body.pwa-mobile input,
body.pwa-mobile textarea,
body.pwa-mobile select {
border-radius: 14px !important;
padding: 13px 15px !important;
font-size: 14px !important;
background: rgba(10, 10, 26, 0.65) !important;
border: 1px solid rgba(168, 85, 247, 0.25) !important;
}

/* 11. Tables Responsive Scroll */
body.pwa-mobile .table {
display: block !important;
width: 100% !important;
overflow-x: auto !important;
-webkit-overflow-scrolling: touch !important;
}
body.pwa-mobile .table th,
body.pwa-mobile .table td {
white-space: nowrap !important;
padding: 12px 10px !important;
font-size: 13px !important;
}

/* 12. Modals, Certificates & Toasts above Header/Nav */
body.pwa-mobile .modal-backdrop,
body.pwa-mobile .cert-backdrop {
z-index: 99500 !important;
padding: 14px !important;
}
body.pwa-mobile .modal {
border-radius: 24px !important;
padding: 22px 18px !important;
background: linear-gradient(160deg, #191636, #0f0d24) !important;
border: 1px solid rgba(168, 85, 247, 0.35) !important;
max-height: 88vh !important;
}
body.pwa-mobile .toast {
z-index: 99800 !important;
bottom: 88px !important;
width: max-content !important;
max-width: 90vw !important;
text-align: center !important;
border-radius: 16px !important;
}
}

/* Header & Bottom Nav Elements */
.ph-btn {
width: 42px; height: 42px;
border-radius: 13px;
background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(99, 102, 241, 0.1));
border: 1px solid rgba(168, 85, 247, 0.35);
color: #fff;
font-size: 19px;
cursor: pointer;
display: flex; align-items: center; justify-content: center;
transition: transform 0.15s ease, background 0.2s ease;
}
.ph-btn:active { transform: scale(0.92); background: rgba(168, 85, 247, 0.35); }
.ph-brand-ar {
font-size: 16px;
font-weight: 900;
background: linear-gradient(135deg, #fff 15%, #d8b4fe 55%, #f472b6 100%);
-webkit-background-clip: text;
background-clip: text;
color: transparent;
display: block;
text-align: center;
line-height: 1.2;
}
.ph-brand-en {
font-size: 8px;
font-weight: 700;
color: rgba(255, 255, 255, 0.5);
letter-spacing: 2.2px;
display: block;
text-align: center;
}

.pn-item {
flex: 1;
background: transparent;
border: none;
color: rgba(255, 255, 255, 0.48);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
font-family: inherit;
padding: 6px 4px;
gap: 3px;
cursor: pointer;
position: relative;
border-radius: 16px;
transition: all 0.22s ease;
}
.pn-item .pn-ico {
font-size: 20px;
transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.pn-item .pn-lbl {
font-size: 10px;
font-weight: 800;
}
.pn-item.active {
color: #ffffff;
background: linear-gradient(180deg, rgba(168, 85, 247, 0.22), rgba(168, 85, 247, 0.04));
}
.pn-item.active .pn-ico {
transform: translateY(-2px) scale(1.12);
filter: drop-shadow(0 4px 8px rgba(168, 85, 247, 0.6));
}
.pn-item.active .pn-lbl {
color: #e879f9;
}
.pn-item.active::after {
content: '';
position: absolute;
top: 0;
width: 22px;
height: 3px;
border-radius: 0 0 6px 6px;
background: linear-gradient(90deg, #a855f7, #ec4899);
box-shadow: 0 2px 8px rgba(236, 72, 153, 0.8);
}

#pwaOverlay {
display: none;
position: fixed;
inset: 0;
background: rgba(6, 5, 18, 0.72);
backdrop-filter: blur(5px);
-webkit-backdrop-filter: blur(5px);
z-index: 9500;
animation: fade 0.2s ease;
}
</style>

<script>
(function(){
// 1) Unregister any old service worker
if ('serviceWorker' in navigator) {
navigator.serviceWorker.getRegistrations().then(function(regs){
regs.forEach(function(r){ try { r.unregister(); } catch(e){} });
});
}

function isMobile(){ return window.innerWidth <= 900; }

function build(){
if (!isMobile()) { document.body.classList.remove('pwa-mobile'); return; }
document.body.classList.add('pwa-mobile');

if (!document.getElementById('pwaHeader')) {
document.body.insertAdjacentHTML('afterbegin',
'<header id="pwaHeader">' +
'<button class="ph-btn" id="phMenu" aria-label="القائمة">☰</button>' +
'<div><span class="ph-brand-ar">مشكاة المعرفة</span>' +
'<span class="ph-brand-en">MISHKAT AL-MAARIFA</span></div>' +
'<button class="ph-btn" id="phUser" aria-label="حسابي">🎓</button>' +
'</header>');
}
if (!document.getElementById('pwaOverlay')) {
document.body.insertAdjacentHTML('beforeend', '<div id="pwaOverlay"></div>');
}
if (!document.getElementById('pwaNav')) {
var tabs = [
{id:'dashboard', ico:'🏠', label:'الرئيسية'},
{id:'lessons', ico:'📚', label:'الدروس'},
{id:'quizzes', ico:'🧠', label:'الاختبارات'},
{id:'files', ico:'📁', label:'الملفات'},
{id:'more', ico:'☰', label:'المزيد'}
];
var html = '<nav id="pwaNav">';
tabs.forEach(function(t){
html += '<button class="pn-item" data-nav="'+t.id+'"><span class="pn-ico">'+t.ico+'</span><span class="pn-lbl">'+t.label+'</span></button>';
});
html += '</nav>';
document.body.insertAdjacentHTML('beforeend', html);
}

var mb = document.getElementById('phMenu');
if (mb) mb.onclick = openDrawer;

document.querySelectorAll('.pn-item').forEach(function(b){
b.onclick = function(){
var id = b.dataset.nav;
if (id === 'more') { openDrawer(); return; }
var target = document.querySelector('.sidebar .nav-item[data-nav="'+id+'"]');
if (target) target.click();
document.querySelectorAll('.pn-item').forEach(function(x){ x.classList.toggle('active', x.dataset.nav === id); });
};
});
var ov = document.getElementById('pwaOverlay');
if (ov) ov.onclick = closeDrawer;
}

function openDrawer(){
var sb = document.querySelector('.sidebar');
var ov = document.getElementById('pwaOverlay');
if (sb) sb.classList.add('open');
if (ov) ov.style.display = 'block';
}
function closeDrawer(){
var sb = document.querySelector('.sidebar');
var ov = document.getElementById('pwaOverlay');
if (sb) sb.classList.remove('open');
if (ov) ov.style.display = 'none';
}

document.addEventListener('click', function(e){
var item = e.target.closest && e.target.closest('.sidebar .nav-item');
if (!item || !isMobile()) return;
var navId = item.getAttribute('data-nav');
if (navId) {
document.querySelectorAll('.pn-item').forEach(function(x){
x.classList.toggle('active', x.dataset.nav === navId);
});
}
setTimeout(closeDrawer, 80);
});

if (document.readyState === 'loading') {
document.addEventListener('DOMContentLoaded', build);
} else { build(); }
setTimeout(build, 500);
setTimeout(build, 1500);
window.addEventListener('resize', function(){ setTimeout(build, 100); });
})();
</script>

<script>
(function() {
    let logged = false;
    setInterval(() => {
        try {
            const u = JSON.parse(localStorage.getItem('user') || '{}');
            if (u.role && u.role !== 'admin' && u.name && !logged) {
                logged = true;
                fetch('/api/visits-box?action=log&name=' + encodeURIComponent(u.name), { method: 'POST' }).catch(()=>{});
            }
            if (u.role === 'admin') {
                let b = document.getElementById('adminBtn');
                if (!b) {
                    b = document.createElement('button');
                    b.id = 'adminBtn';
                    b.innerHTML = '📋 سجل الطلاب';
                    b.style.cssText = 'position:fixed; bottom:20px; left:20px; z-index:99999; background:#9333ea; color:#fff; border:none; padding:10px 16px; border-radius:30px; font-weight:bold; cursor:pointer; font-family:inherit;';
                    b.onclick = showModal;
                    document.body.appendChild(b);
                } else { b.style.display = 'block'; }
            }
        } catch(e) {}
    }, 1000);

    async function showModal() {
        let m = document.getElementById('adminModal');
        if (!m) {
            m = document.createElement('div');
            m.id = 'adminModal';
            m.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100000; display:flex; justify-content:center; align-items:center; direction:rtl;';
            document.body.appendChild(m);
        }
        m.style.display = 'flex';
        m.innerHTML = `<div style="background:#1e1b4b; padding:20px; border-radius:15px; width:90%; max-width:450px; color:#fff; max-height:80vh; display:flex; flex-direction:column;"><h3 style="color:#c084fc; margin-top:0;">سجل زيارات الطلاب</h3><div id="list" style="flex:1; overflow-y:auto; margin:10px 0; background:rgba(255,255,255,0.05); padding:10px; border-radius:10px;">جاري التحميل...</div><div style="display:flex; gap:8px;"><button id="clr" style="background:#ef4444; color:#fff; border:none; padding:8px; border-radius:8px; cursor:pointer; flex:1;">مسح السجل</button><a href="/api/visits-box?action=export" download="db.json" style="background:#10b981; color:#fff; text-decoration:none; padding:8px; border-radius:8px; text-align:center; flex:1;">حفظ البيانات</a><button onclick="document.getElementById('adminModal').style.display='none'" style="background:#334155; color:#fff; border:none; padding:8px; border-radius:8px; cursor:pointer; flex:1;">إغلاق</button></div></div>`;
        
        document.getElementById('clr').onclick = async () => {
            if (confirm('متأكد من مسح السجل؟')) {
                await fetch('/api/visits-box?action=clear', { method: 'POST' });
                showModal();
            }
        };

        const l = document.getElementById('list');
        try {
            const res = await fetch('/api/visits-box?action=list', { method: 'POST' });
            const data = await res.json();
            if (!data || data.length === 0) {
                l.innerHTML = '✅ السجل جاهز ويعمل (لا توجد زيارات طلاب مسجلة بعد).';
                return;
            }
            l.innerHTML = data.map(v => `<div style="padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.1);"><b>👤 ${v.studentName}</b><br><span style="color:#c084fc; font-size:12px;">📅 ${v.date} - ⏰ ${v.time}</span></div>`).join('');
        } catch(e) {
            l.innerHTML = '⚠️ يرجى الانتظار دقيقة ريثما ينتهي Render من التحديث ثم أعد المحاولة.';
        }
    }
})();
</script>
<!-- ====== بداية ميزة تحميل الدروس والمشاهدة بدون إنترنت (نسخة القائمة الجانبية) ====== -->
<script>
(function() {
    // 1. إعداد الذاكرة
    const dbName = 'MishkatOfflineVideosDB';
    let idb;
    const req = indexedDB.open(dbName, 1);
    req.onupgradeneeded = (e) => {
        idb = e.target.result;
        if (!idb.objectStoreNames.contains('lessons')) {
            idb.createObjectStore('lessons', { keyPath: 'id' });
        }
    };
    req.onsuccess = (e) => { idb = e.target.result; };

    function saveLessonOffline(id, title, blob, fileType) {
        return new Promise((resolve, reject) => {
            if (!idb) return reject();
            const tx = idb.transaction('lessons', 'readwrite');
            tx.objectStore('lessons').put({
                id: id, title: title, blob: blob, type: fileType, date: new Date().toLocaleDateString('ar-SY')
            });
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject();
        });
    }

    // 2. المراقبة والإضافة للقائمة الجانبية
    setInterval(() => {
        try {
            const u = JSON.parse(localStorage.getItem('user') || '{}');
            if (!u.role || u.role === 'admin') {
                const offItem = document.getElementById('mishkatOfflineMenuItem');
                if (offItem) offItem.style.display = 'none';
                return;
            }

            // أ) إضافة الخانة داخل القائمة الجانبية بشكل متطابق 100% مع باقي الخانات
            let libItem = document.getElementById('mishkatOfflineMenuItem');
            // في حال إعادة تحميل القائمة في الموقع، نتأكد من إضافته مجدداً
            if (libItem && !document.body.contains(libItem)) libItem = null;

            if (!libItem) {
                // الكلمات المفتاحية للبحث عن القائمة الصحيحة ونسخ تصميمها
                const menuWords = ['الاختبارات', 'الملفات', 'الدروس', 'برنامجي', 'تقدمي'];
                let refItem = null;
                let matchedWord = '';
                
                const allLinks = document.querySelectorAll('a, li, div');
                for (let el of allLinks) {
                    const txt = el.innerText ? el.innerText.trim() : '';
                    if (menuWords.includes(txt) && el.closest('nav, ul, aside, [class*="menu"], [class*="sidebar"]')) {
                        refItem = el.tagName === 'A' ? el : (el.closest('a') || el.closest('li') || el);
                        matchedWord = txt;
                        break;
                    }
                }

                if (refItem && refItem.parentNode) {
                    // نسخ الخانة الأصلية بتصميمها بالكامل
                    libItem = refItem.cloneNode(true);
                    libItem.id = 'mishkatOfflineMenuItem';
                    
                    // استبدال النص مع الحفاظ على الأيقونة الأصلية للمنصة
                    libItem.innerHTML = libItem.innerHTML.replace(matchedWord, 'الدروس المحملة');
                    
                    // تمييز اللون قليلاً ليكون واضحاً (لون أزرق فاتح)
                    libItem.style.color = '#38bdf8';
                    
                    if (libItem.tagName === 'A') libItem.href = '#';
                    libItem.onclick = (e) => {
                        e.preventDefault();
                        // إغلاق القائمة الجانبية عند الضغط على الخانة (في الجوال)
                        const closeBtn = document.querySelector('.close, [class*="close"], .overlay');
                        if (closeBtn) closeBtn.click();
                        openOfflineModal();
                    };
                    
                    // إدراج الخانة الجديدة في القائمة
                    refItem.parentNode.appendChild(libItem);
                }
            } else {
                libItem.style.display = ''; 
            }

            // ب) إضافة زر "تحميل الدرس" تحت كل فيديو يظهر للطالب تلقائياً
            document.querySelectorAll('video, a[href$=".mp4"], a[href$=".pdf"]').forEach((mediaEl, idx) => {
                if (mediaEl.dataset.offlineInjected) return;
                mediaEl.dataset.offlineInjected = 'true';

                const src = mediaEl.currentSrc || mediaEl.src || mediaEl.href || (mediaEl.querySelector('source') && mediaEl.querySelector('source').src);
                if (!src) return;

                const card = mediaEl.closest('div') || mediaEl.parentElement;
                const heading = card ? card.querySelector('h1, h2, h3, h4, b, strong') : null;
                const lessonTitle = heading ? heading.innerText.trim() : ('درس رقم ' + (idx + 1));

                const bar = document.createElement('div');
                bar.style.cssText = 'margin-top:8px; margin-bottom:10px; display:flex; gap:8px; flex-wrap:wrap; direction:rtl;';

                const dlBtn = document.createElement('button');
                dlBtn.innerHTML = '📥 حفظ للمشاهدة بدون إنترنت';
                dlBtn.style.cssText = 'background:#10b981; color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:bold; cursor:pointer; font-family:inherit; font-size:13px; flex:1; display:flex; justify-content:center; align-items:center; gap:6px;';
                
                dlBtn.onclick = async (e) => {
                    e.preventDefault();
                    dlBtn.disabled = true;
                    dlBtn.innerHTML = '⏳ جاري الحفظ...';
                    try {
                        const res = await fetch(src);
                        const blob = await res.blob();
                        await saveLessonOffline(src, lessonTitle, blob, blob.type || 'video/mp4');

                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = lessonTitle + (src.endsWith('.pdf') ? '.pdf' : '.mp4');
                        document.body.appendChild(a);
                        a.click();
                        a.remove();

                        dlBtn.style.background = '#059669';
                        dlBtn.innerHTML = '✅ تم الحفظ (متاح بدون نت)';
                    } catch (err) {
                        const a = document.createElement('a');
                        a.href = src;
                        a.download = lessonTitle;
                        a.target = '_blank';
                        a.click();
                        dlBtn.innerHTML = '✅ تم التحميل';
                    }
                };

                bar.appendChild(dlBtn);
                mediaEl.parentNode.insertBefore(bar, mediaEl.nextSibling);
            });
        } catch(e) {}
    }, 1500);

    // 3. نافذة عرض وتشغيل الدروس المحملة بدون إنترنت
    function openOfflineModal() {
        let m = document.getElementById('mishkatOfflineModal');
        if (!m) {
            m = document.createElement('div');
            m.id = 'mishkatOfflineModal';
            m.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:100000; display:flex; justify-content:center; align-items:center; direction:rtl; padding:15px;';
            document.body.appendChild(m);
        }
        m.style.display = 'flex';
        m.innerHTML = `
            <div style="background:#0f172a; border:1px solid #38bdf8; padding:20px; border-radius:16px; width:100%; max-width:500px; color:#fff; max-height:85vh; display:flex; flex-direction:column;">
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">
                    <h3 style="color:#38bdf8; margin:0; font-size:16px;">📂 دروسي المحملة (تعمل بدون إنترنت)</h3>
                    <button onclick="document.getElementById('mishkatOfflineModal').style.display='none'" style="background:none; border:none; color:#fff; font-size:18px; cursor:pointer;">✖</button>
                </div>
                <div id="offlinePlayerBox" style="margin-top:10px; display:none;"></div>
                <div id="offlineLessonsList" style="flex:1; overflow-y:auto; margin:12px 0; display:flex; flex-direction:column; gap:8px;">جاري فتح الذاكرة...</div>
                <button onclick="document.getElementById('mishkatOfflineModal').style.display='none'" style="background:#334155; color:#fff; border:none; padding:10px; border-radius:8px; cursor:pointer; font-family:inherit; font-weight:bold;">إغلاق</button>
            </div>
        `;

        const listEl = document.getElementById('offlineLessonsList');
        const playerBox = document.getElementById('offlinePlayerBox');

        if (!idb) {
            listEl.innerHTML = 'الذاكرة غير جاهزة بعد.';
            return;
        }

        const tx = idb.transaction('lessons', 'readonly');
        const reqAll = tx.objectStore('lessons').getAll();
        reqAll.onsuccess = () => {
            const items = reqAll.result || [];
            if (items.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:20px 0;">لم تقم بحفظ أي درس بعد. اضغط على "📥 حفظ للمشاهدة بدون إنترنت" تحت أي فيديو لحفظه هنا.</p>';
                return;
            }
            listEl.innerHTML = '';
            items.forEach(item => {
                const row = document.createElement('div');
                row.style.cssText = 'background:rgba(255,255,255,0.06); padding:10px; border-radius:10px; display:flex; justify-content:space-between; align-items:center; gap:8px;';
                row.innerHTML = `
                    <div style="flex:1;">
                        <b style="font-size:14px; display:block;">🎬 ${item.title}</b>
                        <span style="font-size:11px; color:#94a3b8;">تاريخ الحفظ: ${item.date}</span>
                    </div>
                    <button class="play-off" style="background:#0ea5e9; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-family:inherit; font-weight:bold;">▶ تشغيل</button>
                    <button class="del-off" style="background:#ef4444; color:#fff; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; font-family:inherit;">🗑️</button>
                `;

                row.querySelector('.play-off').onclick = () => {
                    const url = URL.createObjectURL(item.blob);
                    playerBox.style.display = 'block';
                    if (item.type && item.type.includes('pdf')) {
                        playerBox.innerHTML = `<iframe src="${url}" style="width:100%; height:250px; border-radius:8px; border:none;"></iframe>`;
                    } else {
                        playerBox.innerHTML = `<video src="${url}" controls autoplay style="width:100%; max-height:240px; border-radius:8px; background:#000;"></video>`;
                    }
                };

                row.querySelector('.del-off').onclick = () => {
                    const delTx = idb.transaction('lessons', 'readwrite');
                    delTx.objectStore('lessons').delete(item.id);
                    delTx.oncomplete = () => openOfflineModal();
                };

                listEl.appendChild(row);
            });
        };
    }
})();
</script>
<!-- ====== نهاية ميزة تحميل الدروس بدون إنترنت ====== -->
</body>
</html>
